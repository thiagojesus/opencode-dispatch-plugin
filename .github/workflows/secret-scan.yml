name: Secret and artifact scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: Scan packed artifact and repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve LF checkout
        run: git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Scan committed source for credential-shaped values
        run: >-
          git grep -nEI "(api[_-]?key|authorization|password|secret|token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_=-]{20,}['\"]" -- ':!evidence/**' ':!apps/pwa/evidence/**' && exit 1 || exit 0
      - name: Scan reachable history for credential-shaped values
        run: >-
          git log -p --all -- ':!evidence/**' ':!apps/pwa/evidence/**' | grep -nEI "(api[_-]?key|authorization|password|secret|token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_=-]{20,}['\"]" && exit 1 || exit 0
      - name: Scan exact packed artifact
        run: bun run test:package
