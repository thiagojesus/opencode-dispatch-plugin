name: Package cross-platform matrix

on:
  pull_request:
    paths:
      - ".github/workflows/package-cross-platform.yml"
      - "apps/pwa/**"
      - "packages/broker/**"
      - "packages/contracts/**"
      - "packages/plugin/**"
      - "tests/package/**"
      - "package.json"
      - "bun.lock"
  push:
    paths:
      - ".github/workflows/package-cross-platform.yml"
      - "apps/pwa/**"
      - "packages/broker/**"
      - "packages/contracts/**"
      - "packages/plugin/**"
      - "tests/package/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }}, OpenCode ${{ matrix.opencode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - windows-2025
        opencode:
          - 1.18.3
          - 1.18.25
    env:
      TODO15_OPENCODE_VERSION: ${{ matrix.opencode }}
    steps:
      - name: Preserve LF checkout
        run: git config --global core.autocrlf false
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install exact OpenCode fixture
        run: bun install --global opencode-ai@${{ matrix.opencode }}
      - name: Verify package artifact and official install
        run: bun run test:package
      - name: Run strict typecheck
        run: bun run typecheck
      - name: Check package source formatting
        run: bunx biome check packages/plugin tests/package package.json
